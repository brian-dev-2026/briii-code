# Builds Briii Code and publishes the installer as a GitHub Release, which the in-app updater
# (brand/extensions/briii-update) installs automatically. scripts/ci-release-plan.ps1 decides
# whether a build is due: new VSCodium release, last release 7+ days old, a push, or a manual run.
name: Release

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - 'brand/**'
      - 'defaults/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # the "VSCodium is behind VS Code" issue

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release   # holds BRIII_SIGNING_KEY
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, like local builds
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to build
        id: plan
        run: .\scripts\ci-release-plan.ps1 -Trigger '${{ github.event_name }}' -RunNumber ${{ github.run_number }} -Repo '${{ github.repository }}'

      # VS Code's fixes only reach Briii through VSCodium releases. One open issue (GitHub emails
      # it) while VSCodium is 21+ days behind a newer VS Code; closed once it catches up.
      - name: Report whether VSCodium is behind VS Code
        continue-on-error: true   # never blocks a release
        env:
          LAG: ${{ steps.plan.outputs.lag }}
        run: |
          $title = 'VSCodium is behind VS Code'
          $issues = gh issue list --state open --limit 100 --json number,title | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $open = @($issues | Where-Object { $_.title -eq $title })
          if ($env:LAG -and -not $open) {
            gh issue create --title $title --body $env:LAG
          } elseif (-not $env:LAG) {
            foreach ($i in $open) { gh issue close $i.number --comment 'VSCodium has caught up.' }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        if: steps.plan.outputs.build == 'true'
        run: choco install innosetup --version 6.7.1 -y --no-progress   # pinned: build.ps1 looks for Inno Setup 6

      # A broken updater can't fix itself once released, so the built-in extensions' tests gate every build.
      - name: Test built-in extensions
        if: steps.plan.outputs.build == 'true'
        run: |
          Get-ChildItem brand\extensions\briii-update, brand\extensions\briii-sync, brand\extensions\briii-layout, brand\extensions\briii-deploy -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
          node --test "brand/extensions/briii-update/test/*.test.js" "brand/extensions/briii-sync/test/*.test.js" "brand/extensions/briii-layout/test/*.test.js" "brand/extensions/briii-deploy/test/*.test.js" scripts/test/sign-release.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -File scripts\test\release-checks.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -File brand\extensions\briii-update\test\helper.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -File installer\test\swap.test.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        if: steps.plan.outputs.build == 'true'
        run: .\scripts\build.ps1 -Version '${{ steps.plan.outputs.vscodium }}' -Release '${{ steps.plan.outputs.release }}'

      - name: Verify (install, branding, checksums, extensions, uninstall)
        if: steps.plan.outputs.build == 'true'
        run: .\scripts\verify.ps1 -NoGui

      - name: Publish release
        if: steps.plan.outputs.build == 'true'
        env:
          BRIII_SIGNING_KEY: ${{ secrets.BRIII_SIGNING_KEY }}   # only this step sees the key
        run: |
          $id = '${{ steps.plan.outputs.release }}'
          $name = "BriiiCode-Setup-x64-$id.exe"
          $exe = Join-Path $PWD "out\$name"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$exe.sha256", "$sha  $name`n", (New-Object Text.UTF8Encoding $false))
          # Sign the .sha256 and check the signature against the shipped public keys; a failure
          # stops the job before anything is published.
          node scripts/sign-release.mjs "$exe.sha256"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/sign-release.mjs --verify "$exe.sha256"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release create "v$id" $exe "$exe.sha256" "$exe.sha256.sig" --title "Briii Code $id" --notes "Built from VSCodium ${{ steps.plan.outputs.vscodium }}. Installs itself automatically in Briii Code; or download and run the installer." --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The newest 3 releases are kept: Install Previous Version (rollback) needs the older two.
      # Updates only use the latest, and this runs after the new one is published.
      - name: Keep the newest 3 releases
        if: steps.plan.outputs.build == 'true'
        run: |
          $old = gh release list --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[3:][] | .tagName'
          foreach ($tag in $old) { if ($tag) { gh release delete $tag --yes --cleanup-tag } }
