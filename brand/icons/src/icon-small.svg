<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128">
  <!-- Briii Code icon for 16-24 px (app.ico small frames, title bar): no circuit channels or
       sheen, a slightly heavier B, so tiny sizes stay crisp. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2340"/><stop offset=".55" stop-color="#0D1326"/><stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="signal" x1="30" y1="18" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A98FF"/><stop offset=".55" stop-color="#48BEFF"/><stop offset="1" stop-color="#4DEBD4"/>
    </linearGradient>
  </defs>
  <path fill="url(#tile)" d="M38 0 H90 C118 0 128 10 128 38 V90 C128 118 118 128 90 128 H38 C10 128 0 118 0 90 V38 C0 10 10 0 38 0 Z"/>
  <g transform="translate(64 64) scale(.8) translate(-65 -64)">
    <path fill="none" stroke="url(#signal)" stroke-width="17" stroke-linejoin="miter" stroke-linecap="square"
          d="M40 26 V102 M40 26 H64 A16 16 0 0 1 64 58 H40 M40 58 H68 A22 22 0 0 1 68 102 H40"/>
  </g>
</svg>
